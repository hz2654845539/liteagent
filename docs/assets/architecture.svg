<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">LiteAgent 架构 · 一次提问的数据流</text>

  <!-- UI 层 -->
  <rect x="80" y="56" width="800" height="64" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="100" y="82" font-size="15" font-weight="700" fill="#1f2937">UI 层（Jetpack Compose）</text>
  <text x="100" y="104" font-size="12.5" fill="#4b5563">ChatScreen · ChatTopBar（预设/会话/导出）· BenchmarkScreen · StatusCard</text>
  <text x="830" y="104" font-size="11.5" fill="#9ca3af" text-anchor="end">autotest 入口</text>

  <line x1="480" y1="120" x2="480" y2="148" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="492" y="140" font-size="11" fill="#6b7280">state / intent</text>

  <!-- ViewModel 层 -->
  <rect x="80" y="150" width="800" height="96" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="100" y="176" font-size="15" font-weight="700" fill="#1f2937">ChatViewModel（大脑）</text>
  <text x="100" y="198" font-size="12.5" fill="#4b5563">send 流水线（try/finally 兜底）· MessageAssembler（历史+摘要组装，预算 300 字）</text>
  <text x="100" y="218" font-size="12.5" fill="#4b5563">上下文压缩（541 字→87 字摘要）· 会话管理 · OCR 编排 · 设备推荐</text>
  <text x="830" y="176" font-size="11.5" fill="#6366f1" text-anchor="end">58 个单测覆盖</text>

  <!-- 旁路层 -->
  <line x1="200" y1="246" x2="200" y2="274" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="480" y1="246" x2="480" y2="274" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="760" y1="246" x2="760" y2="274" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="110" y="276" width="220" height="62" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
  <text x="220" y="300" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="middle">RagEngine（BM25）</text>
  <text x="220" y="320" font-size="11.5" fill="#4b5563" text-anchor="middle">中文 bigram · 引用标注</text>

  <rect x="370" y="276" width="220" height="62" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
  <text x="480" y="300" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="middle">DocumentStore / SessionStore</text>
  <text x="480" y="320" font-size="11.5" fill="#4b5563" text-anchor="middle">本地 JSON，原子落盘</text>

  <rect x="630" y="276" width="220" height="62" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
  <text x="740" y="300" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="middle">PresetStore / ToolRouter / OCR</text>
  <text x="740" y="320" font-size="11.5" fill="#4b5563" text-anchor="middle">预设 · 提醒工具 · ML Kit</text>

  <!-- 汇聚到引擎 -->
  <line x1="480" y1="338" x2="480" y2="372" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="492" y="362" font-size="11" fill="#6b7280">组装好的 messages（role, content）</text>

  <!-- LlmEngine -->
  <rect x="80" y="374" width="800" height="66" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="100" y="400" font-size="15" font-weight="700" fill="#1f2937">LlmEngine（Kotlin 封装）</text>
  <text x="100" y="422" font-size="12.5" fill="#4b5563">generate(messages) → Flow&lt;String&gt; 流式 · stop() 可中断 · perf() 性能快照 · 3 线程最优</text>
  <text x="830" y="400" font-size="11.5" fill="#b45309" text-anchor="end">JNI 之上</text>

  <line x1="480" y1="440" x2="480" y2="468" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="492" y="460" font-size="11" fill="#6b7280">JNI（llm_jni.cpp）：roles[]/contents[] → ChatMessages → 回调 onToken</text>

  <!-- MNN -->
  <rect x="80" y="470" width="800" height="104" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="100" y="496" font-size="15" font-weight="700" fill="#1f2937">libMNN.so（LLM 引擎，7.2 MB，自编译含 LLM 模块）</text>
  <text x="100" y="518" font-size="12.5" fill="#4b5563">prefill（读 prompt，25 t/s）→ decode 循环（7 t/s）→ TokenCallback 逐 token 上抛</text>
  <text x="100" y="540" font-size="12.5" fill="#4b5563">量化模型 Qwen2.5-0.5B / 1.5B（W4，本地文件，断点续传 + SHA-256 校验）</text>
  <text x="100" y="561" font-size="11.5" fill="#9ca3af">MNN 的 reuse_kv 对标准 attention 无效（实测）；线程数 3 最优（5 反而慢 10%）</text>

  <!-- 底部注解 -->
  <text x="480" y="608" text-anchor="middle" font-size="12" fill="#6b7280">全程离线：模型、文档、会话均在设备本地 · 设备自适应：1950MB 老机跑 0.5B 极限档，12GB 旗舰跑 3B</text>
</svg>
