name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  android-unit-test:
    name: Android 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 授权 gradlew
        run: chmod +x ./gradlew

      # 只跑 JVM 单测：不触发 CMake / NDK，
      # 因为 libMNN.so 需要单独编译（见 tools/build_mnn_android.sh），CI 上不重复做这件事
      - name: 运行单元测试
        run: ./gradlew :app-android:testDebugUnitTest --no-daemon --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: app-android/build/reports/tests/

  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r backend/requirements.txt

      - name: 运行 unittest
        working-directory: backend
        run: python -m unittest discover -s tests -v
